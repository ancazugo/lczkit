[project]
name = "lczkit"
version = "0.1.0"
description = "Map cities into Local Climate Zones from open vector and raster data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=1.5.5",
    "earthengine-api>=1.7.38",
    "exactextract>=0.3.0",
    "geopandas>=1.1.4",
    "geoplanar>=0.6.0",
    "libpysal>=4.15.0",
    "momepy>=1.0.0",
    "neatnet>=0.1.6",
    "networkx>=3.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.0",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
viz = [
    "tippecanoe==2.72.0",
]

[project.scripts]
lczkit = "lczkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lczkit"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

# `google` is chosen on measurement, not taste. The docstrings here are narrative prose with no
# `Args:`/`Parameters` sections anywhere in the package, so no convention's *section* rules apply
# and the choice only decides which nuisance rules switch off. `google` drops D401
# (non-imperative-mood), which fires 67 times against a codebase that deliberately opens with a
# claim about what a thing is — "`compute_parameters()` — the four parameter blocks joined into
# one table" — rather than with a verb. It also resolves the D203/D211 and D212/D213
# incompatibilities without an explicit ignore list, and it is mkdocstrings-python's own default,
# so the linter and the docs renderer read the docstrings the same way.
[tool.ruff.lint.pydocstyle]
convention = "google"

# `src/` is the published API and the only thing mkdocstrings renders, so it carries `D`.
# `tests/` names its behavioural claim in the test function name (785 of them, prose-sentence
# style) and would add 1146 violations saying the same thing twice; `scripts/` is one-off
# analyses, already at 100% module-docstring coverage, and is deliberately not importable.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
# `scripts/notebooks/` holds jupytext percent scripts, which are notebooks rather than modules:
# `# %%` separates cells and their order is the document's order. E402 asks for every import at
# the top of the file, and the first cell has to install warning filters *before* the imports
# they apply to — otherwise a `TqdmWarning` about a missing `ipywidgets` is the first thing a
# reader of the published page sees.
#
# The `.ipynb` needs the same exemption for the same reason, and it is not the same path: ruff
# lints notebooks natively, and `docs_src/demo/bogota.ipynb` is *generated* from the script above.
# Exempting one and not the other would fail the build on a file nobody edits by hand.
"scripts/notebooks/**" = ["D", "E402"]
"docs_src/demo/*.ipynb" = ["D", "E402"]

# `ruff format` reads Python fences inside Markdown, and `docs/references/tables/` holds
# hand-checked transcriptions that are the authority for every numeric lookup in this package.
# Reformatting them would be a whitespace-only change to a file whose value is that it is a
# faithful copy — cheap to exclude, and one less reason for a transcription to drift.
[tool.ruff.format]
exclude = ["docs/references/tables/*.md"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true

# None of these ship type stubs or a py.typed marker, and no types-* stub package exists for
# any of them on PyPI.
[[tool.mypy.overrides]]
module = [
    "geoplanar",
    "neatnet",
    "momepy",
    "libpysal",
    "libpysal.*",
    "rasterio",
    "rasterio.*",
    "exactextract",
    "exactextract.*",
    "ee",
]
ignore_missing_imports = true

# `scipy-stubs` exists on PyPI, unlike the above, but is a whole extra dependency for the two
# functions `cleaning.streets` imports to reproduce neatnet's face-artifact threshold.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# `types-networkx` exists on PyPI too, same story: `lczkit.morphometrics.streets` only names the
# `networkx.Graph` type momepy's own network functions already return, and pulling in a whole
# stub dependency for one type annotation is not worth it.
[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

# `pyogrio` ships no py.typed marker; `tippecanoe` is a wheel wrapping a C++ binary, whose Python
# surface is six `subprocess.call` shims and a `BIN_DIR` string.
[[tool.mypy.overrides]]
module = ["pyogrio", "pyogrio.*", "tippecanoe"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require live network access (skipped by default)",
]
addopts = "-m 'not network'"
filterwarnings = [
    # rasterio 1.5 sets `.shape` on the array it returns from `read()`, which NumPy 2.5
    # deprecated. Raised from Cython, so it surfaces at our call site and cannot be fixed here.
    # Remove once rasterio ships a fix.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # exactextract only *warns* when the features and the raster disagree on CRS, and then
    # reduces anyway over meaningless coordinates. LocalRasterSource always reprojects units to
    # the raster's CRS, so promoting this to an error makes that a tested guarantee rather than
    # something a future refactor could quietly drop.
    "error:Spatial reference system of input features does not exactly match raster:RuntimeWarning",
]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-geopandas>=1.1.4.20260728",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
