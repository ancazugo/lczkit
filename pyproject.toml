[project]
name = "lczkit"
version = "0.1.0"
description = "Map cities into Local Climate Zones from open vector and raster data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "geopandas>=1.1.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lczkit"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require live network access (skipped by default)",
]
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-geopandas>=1.1.4.20260728",
]
