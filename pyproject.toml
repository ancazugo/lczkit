[project]
name = "lczkit"
version = "0.1.0"
description = "Map cities into Local Climate Zones from open vector and raster data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=1.5.5",
    "earthengine-api>=1.7.38",
    "exactextract>=0.3.0",
    "geopandas>=1.1.4",
    "geoplanar>=0.6.0",
    "momepy>=1.0.0",
    "neatnet>=0.1.6",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.0",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
viz = [
    "tippecanoe==2.72.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lczkit"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true

# None of these ship type stubs or a py.typed marker, and no types-* stub package exists for
# any of them on PyPI.
[[tool.mypy.overrides]]
module = [
    "geoplanar",
    "neatnet",
    "momepy",
    "rasterio",
    "rasterio.*",
    "exactextract",
    "exactextract.*",
    "ee",
]
ignore_missing_imports = true

# `scipy-stubs` exists on PyPI, unlike the above, but is a whole extra dependency for the two
# functions `cleaning.streets` imports to reproduce neatnet's face-artifact threshold.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# `pyogrio` ships no py.typed marker; `tippecanoe` is a wheel wrapping a C++ binary, whose Python
# surface is six `subprocess.call` shims and a `BIN_DIR` string.
[[tool.mypy.overrides]]
module = ["pyogrio", "pyogrio.*", "tippecanoe"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require live network access (skipped by default)",
]
addopts = "-m 'not network'"
filterwarnings = [
    # rasterio 1.5 sets `.shape` on the array it returns from `read()`, which NumPy 2.5
    # deprecated. Raised from Cython, so it surfaces at our call site and cannot be fixed here.
    # Remove once rasterio ships a fix.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # exactextract only *warns* when the features and the raster disagree on CRS, and then
    # reduces anyway over meaningless coordinates. LocalRasterSource always reprojects units to
    # the raster's CRS, so promoting this to an error makes that a tested guarantee rather than
    # something a future refactor could quietly drop.
    "error:Spatial reference system of input features does not exactly match raster:RuntimeWarning",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-geopandas>=1.1.4.20260728",
]
