[project]
name = "lczkit"
version = "0.1.0"
description = "Map cities into Local Climate Zones from open vector and raster data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=1.5.5",
    "geopandas>=1.1.4",
    "geoplanar>=0.6.0",
    "neatnet>=0.1.6",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lczkit"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true

# None of these ship type stubs or a py.typed marker, and no types-* stub package exists for
# any of them on PyPI.
[[tool.mypy.overrides]]
module = ["geoplanar", "neatnet", "momepy", "rasterio", "rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require live network access (skipped by default)",
]
addopts = "-m 'not network'"
filterwarnings = [
    # rasterio 1.5 sets `.shape` on the array it returns from `read()`, which NumPy 2.5
    # deprecated. Raised from Cython, so it surfaces at our call site and cannot be fixed here.
    # Remove once rasterio ships a fix.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-geopandas>=1.1.4.20260728",
]
