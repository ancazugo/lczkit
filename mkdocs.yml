site_name: lczkit
site_description: Map cities into Local Climate Zones from open vector and raster data
site_url: https://ancazugo.github.io/lczkit/
repo_url: https://github.com/ancazugo/lczkit
repo_name: ancazugo/lczkit
edit_uri: edit/master/docs_src/

# NOT `docs`. That directory holds the transcribed reference tables and 205 MB of gitignored
# reference PDFs. A `docs_dir` pointing there would copy every one of them into `site/` on a local
# build, and `mkdocs gh-deploy` would publish them. A docs_dir that cannot contain a PDF is a
# stronger guarantee than an `exclude_docs` rule that has to stay correct.
docs_dir: docs_src

# Every warning is an error: a broken cross-reference in an API page is exactly the kind of rot
# that is invisible in a rendered site and obvious in a build log.
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The demonstration map sites are copied in whole and are reached from an `<iframe>`, not from the
# nav. Without this every markdown file inside one — the vendored bundles' `LICENSES.md` — is an
# "exists but is not in nav" warning, and `strict: true` makes each of those fail the build.
not_in_nav: |
  demo/*/**

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # `execute: false` is the default and is set explicitly because it is load-bearing rather than
  # incidental. The docs workflow runs `uv sync --only-group docs`, so the build environment has
  # neither lczkit nor the geo stack nor a DATA_DIR — it could not execute the demonstration
  # notebook if it tried, and would fail the deploy attempting it. The notebook is committed with
  # its outputs, produced by a local run against real data.
  - mkdocs-jupyter:
      execute: false
      include_source: true
      # Narrowed from the plugin's default `["*.py", "*.ipynb", "*.md"]`. A demonstration run's
      # map site is copied into `docs_src/demo/` whole, and it ships a `serve.py` — which the
      # default pattern matches, so mkdocs-jupyter *converted it to a page* and rewrote it to
      # `demo/<site>/serve/serve.py`, moving a file the site loads by relative path.
      include: ["*.ipynb"]
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # griffe reads the source statically and never imports `lczkit`, so the docs build
          # needs none of duckdb / geopandas / rasterio / exactextract / neatnet installed.
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: false
            # 367 PEP 258 attribute docstrings carry the majority of this package's prose —
            # 119 in `config.py` alone. Losing them would lose most of the documentation.
            show_docstring_attributes: true
            show_labels: true
            heading_level: 2
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  # The glossary is a definition list. Built into python-markdown, so no new dependency.
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.smartsymbols

nav:
  - Home: index.md
  - Glossary: glossary.md
  - Demonstration: demo/bogota.ipynb
  - API reference:
      - Overview: api/index.md
      - Protocols: api/protocols.md
      - Configuration: api/config.md
      - Pipeline: api/pipeline.md
      - Sources: api/sources.md
      - Cleaning: api/cleaning.md
      - Spatial units: api/units.md
      - Height cascade: api/heights.md
      - Land cover: api/landcover.md
      - Urban canopy parameters: api/ucp.md
      - Classification: api/classify.md
      - Validation: api/validation.md
      - Output: api/output.md
      - Map site: api/viz.md
      - Command line: api/cli.md
